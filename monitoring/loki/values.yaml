
# Loki monitoring configuration
# Lab: cicd-security-lab
# Helm chart: grafana-community/loki 21.3.1

deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Disable optional components for the local lab
gateway:
  enabled: false

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable Helm tests that depend on Loki Canary
test:
  enabled: false

# Disable Simple Scalable components
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0
